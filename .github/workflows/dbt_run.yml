name: dbt Run & Test Pipeline

on:
  schedule:
    # Run every Monday at 9 AM UTC (9 PM Tuesday in NZ)
    - cron: '0 9 * * 1'
  
  # Also run when you push code to main branch
  push:
    branches:
      - main

jobs:
  dbt_run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Create .dbt directory
        run: mkdir -p ~/.dbt
      
      - name: Create profiles.yml
        run: |
          cat > ~/.dbt/profiles.yml << 'EOF'
          ecommerce_dbt:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: SYSADMIN
                database: ANALYTICS_DB
                schema: STAGING
                threads: 1
                client_session_keep_alive: False
          EOF
      
      - name: Install dependencies
        run: |
          pip install dbt-snowflake python-dotenv
      
      - name: Run dbt Models and Tests
        env:
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        working-directory: ecommerce_dbt
        run: |
          dbt deps
          dbt run
          dbt test
      
      - name: Notify if success
        if: success()
        run: echo "✅ Pipeline executed successfully!"
      
      - name: Notify if failed
        if: failure()
        run: echo "❌ Pipeline failed - check logs"